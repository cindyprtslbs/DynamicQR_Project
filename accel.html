<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Accelerometer Sender</title>

<meta name="viewport" content="width=device-width, initial-scale=1">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

*{box-sizing:border-box}

body{
margin:0;
font-family:system-ui,-apple-system,Segoe UI,Roboto;
background:linear-gradient(135deg,#eef2ff,#f8fafc);
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
padding:20px;
}

.container{
background:white;
padding:25px;
border-radius:18px;
width:420px;
box-shadow:0 12px 30px rgba(0,0,0,0.08);
text-align:center;
}

h2{
margin-top:0;
color:#1e293b;
}

.device{
display:flex;
gap:10px;
margin-bottom:15px;
}

.device input{
flex:1;
padding:10px;
border-radius:8px;
border:1px solid #cbd5e1;
}

.status{
background:#f1f5f9;
padding:10px;
border-radius:10px;
margin-bottom:15px;
font-weight:600;
color:#334155;
}

.buttons{
display:flex;
gap:10px;
margin-bottom:15px;
}

button{
flex:1;
padding:12px;
border:none;
border-radius:10px;
background:#6366f1;
color:white;
font-weight:600;
cursor:pointer;
}

button:hover{
background:#4f46e5;
}

.stop{
background:#ef4444;
}

.stop:hover{
background:#dc2626;
}

canvas{
margin-top:10px;
}

</style>
</head>

<body>

<div class="container">

<h2>📱 Accelerometer Sender</h2>

<div class="device">
<input id="deviceInput" value="dev-001">
</div>

<div id="live" class="status">
waiting sensor...
</div>

<div class="buttons">
<button onclick="start()">START</button>
<button class="stop" onclick="stop()">STOP</button>
</div>

<canvas id="chart" height="140"></canvas>

</div>

<script>

const BASE_URL="https://script.google.com/macros/s/AKfycbzcXUoW72V2buKQi8d4lP-5j_AdL72AF3zsPVQ1dpP1oPEdqEt9bt3COS5G08aL9SV2/exec";

let device_id="dev-001";
let samples=[];
let isRunning=false;
let timerSend=null;
let lastSample=0;

const chart=new Chart(document.getElementById("chart"),{
type:"line",
data:{
labels:[],
datasets:[
{label:"X",borderColor:"#ef4444",data:[],pointRadius:0},
{label:"Y",borderColor:"#22c55e",data:[],pointRadius:0},
{label:"Z",borderColor:"#3b82f6",data:[],pointRadius:0}
]},
options:{
animation:false,
responsive:true,
plugins:{legend:{position:"bottom"}},
scales:{y:{min:-20,max:20}}
}
});

function updateChart(x,y,z){

chart.data.labels.push(Date.now());

chart.data.datasets[0].data.push(x);
chart.data.datasets[1].data.push(y);
chart.data.datasets[2].data.push(z);

if(chart.data.labels.length>30){
chart.data.labels.shift();
chart.data.datasets.forEach(d=>d.data.shift());
}

chart.update("none");
}

function start(){

device_id=document.getElementById("deviceInput").value.trim();

if(isRunning) return;

isRunning=true;

window.addEventListener("devicemotion",motionHandler);

timerSend=setInterval(sendBatch,500);
}

function stop(){

isRunning=false;

window.removeEventListener("devicemotion",motionHandler);

clearInterval(timerSend);

samples=[];
}

function motionHandler(e){

const now=Date.now();

if(now-lastSample<20) return;

lastSample=now;

const acc=e.accelerationIncludingGravity;

if(!acc) return;

const x=Number(acc.x);
const y=Number(acc.y);
const z=Number(acc.z);

document.getElementById("live").innerText=`X: ${x.toFixed(2)}   Y: ${y.toFixed(2)}   Z: ${z.toFixed(2)}`;

updateChart(x,y,z);

samples.push({
t:new Date().toISOString(),
x:x,
y:y,
z:z
});
}

async function sendBatch(){

if(samples.length===0) return;

const payload={
device_id:device_id,
ts:new Date().toISOString(),
samples:samples
};

samples=[];

try{

await fetch(BASE_URL+"?path=/telemetry/accel",{
method:"POST",
body:JSON.stringify(payload)
});

}catch(e){}

}

</script>

</body>
</html>
