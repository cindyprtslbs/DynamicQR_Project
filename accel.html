<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Accelerometer Client</title>

<style>
body{
  font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
  background: linear-gradient(135deg,#eef2ff,#f8fafc);
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
  margin:0;
}

.container{
  background:white;
  padding:32px;
  border-radius:18px;
  box-shadow:0 10px 30px rgba(0,0,0,0.08);
  width:340px;
  text-align:center;
}

h2{
  margin-top:0;
  margin-bottom:20px;
  color:#1e293b;
}

#live{
  font-size:14px;
  color:#475569;
  margin-bottom:16px;
  padding:10px;
  background:#f8fafc;
  border-radius:10px;
  box-shadow: inset 0 0 0 1px #e2e8f0;
}

.buttons{
  display:flex;
  gap:10px;
  margin-bottom:18px;
}

button{
  flex:1;
  padding:14px;
  border:none;
  border-radius:12px;
  background:#6366f1;
  color:white;
  font-size:15px;
  font-weight:600;
  cursor:pointer;
  transition:0.25s;
}

button:hover{
  background:#4f46e5;
  transform:translateY(-1px);
}

button:active{
  transform:translateY(0);
}

button.stop{
  background:#ef4444;
}

button.stop:hover{
  background:#dc2626;
}

h3{
  font-size:15px;
  color:#1e293b;
  margin-bottom:8px;
}

pre{
  background:#f8fafc;
  padding:12px;
  border-radius:12px;
  box-shadow: inset 0 0 0 1px #e2e8f0;
  font-size:13px;
  color:#334155;
  text-align:left;
}
</style>
</head>

<body>

<div class="container">
  <h2>Accelerometer (Batch)</h2>

  <p id="live">Waiting sensor...</p>

  <div class="buttons">
    <button onclick="start()">Start</button>
    <button class="stop" onclick="stop()">Stop</button>
  </div>

  <h3>Latest from Server</h3>
  <pre id="latest">-</pre>
</div>

<script>
const BASE_URL="https://script.google.com/macros/s/AKfycbzumJol1nNaVW9duf8ylbFW7CoJvMFw4xt9geUr9p0ehFq02bJV2J5aWqXGMxYYg7wf/exec"; 
const device_id="dev-"+Math.random().toString(36).substring(2,8);

let samples=[];
let timerSend=null;
let motionHandler=null;
let isRunning=false;

// ================= START =================
function start(){
  if(isRunning) return;
  isRunning=true;

  motionHandler = e=>{
    const acc = e.accelerationIncludingGravity;
    if(!acc) return;

    const x=acc.x;
    const y=acc.y;
    const z=acc.z;

    live.innerText=`x:${x.toFixed(2)} y:${y.toFixed(2)} z:${z.toFixed(2)}`;

    samples.push({
      t:new Date().toISOString(),
      x:x,
      y:y,
      z:z
    });
  };

  window.addEventListener("devicemotion", motionHandler);

  timerSend=setInterval(sendBatch,5000);
}

// ================= STOP =================
function stop(){
  if(!isRunning) return;
  isRunning=false;

  clearInterval(timerSend);
  timerSend=null;

  if(motionHandler){
    window.removeEventListener("devicemotion", motionHandler);
    motionHandler=null;
  }

  samples=[];
  live.innerText="Stopped";
}

// ================= SEND BATCH =================
async function sendBatch(){
  if(samples.length===0) return;

  const payload={
    device_id:device_id,
    ts:new Date().toISOString(),
    samples:samples
  };

  samples=[];

  try{
    const res=await fetch(BASE_URL+"?path=/telemetry/accel",{
      method:"POST",
      body:JSON.stringify(payload)
    });

    const json=await res.json();
    console.log("POST:",json);
  }catch(err){
    console.log("send error",err);
  }
}

// ================= GET LATEST =================
async function getLatest(){
  try{
    const res=await fetch(BASE_URL+"?path=/telemetry/accel/latest&device_id="+device_id);
    const json=await res.json();

    if(json.ok){
      latest.innerText=
`time: ${json.data.t}
x: ${json.data.x}
y: ${json.data.y}
z: ${json.data.z}`;
    }
  }catch(err){
    console.log("latest error");
  }
}

setInterval(getLatest,3000);
</script>

</body>
</html>
