<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Accelerometer Client</title>
</head>
<body>

<h2>Accelerometer</h2>
<p id="live">Waiting sensor...</p>
<button onclick="start()">Start</button>
<button onclick="stop()">Stop</button>

<h3>Latest from Server</h3>
<pre id="latest"></pre>

<script>
const BASE="https://script.google.com/macros/s/AKfycbydhM-0Jm6Hxx28GnfZq-dB7ZciXqJLIWJhCzPuKZcCUQKecTkWJaReQOntXTD4Rpgh/exec";
const device_id="dev-"+Math.random().toString(36).substring(2,8);

let samples=[];
let timerSend=null;
let motionHandler=null;
let isRunning=false;

// ================= START =================
async function start(){
  if(isRunning) return;

  // iOS permission
  if (typeof DeviceMotionEvent !== "undefined" &&
      typeof DeviceMotionEvent.requestPermission === "function") {
    const permission = await DeviceMotionEvent.requestPermission();
    if (permission !== "granted") {
      alert("Permission denied");
      return;
    }
  }

  isRunning=true;

  motionHandler = e=>{
    if(!e.accelerationIncludingGravity) return;

    const x=e.accelerationIncludingGravity.x || 0;
    const y=e.accelerationIncludingGravity.y || 0;
    const z=e.accelerationIncludingGravity.z || 0;

    live.innerText=`x:${x.toFixed(2)} y:${y.toFixed(2)} z:${z.toFixed(2)}`;

    samples.push({
      t:new Date().toISOString(),
      x:x,
      y:y,
      z:z
    });
  };

  window.addEventListener("devicemotion", motionHandler);
  timerSend=setInterval(sendBatch,3000);
}

// ================= STOP =================
function stop(){
  if(!isRunning) return;
  isRunning=false;

  clearInterval(timerSend);
  timerSend=null;

  if(motionHandler){
    window.removeEventListener("devicemotion", motionHandler);
    motionHandler=null;
  }

  live.innerText="Stopped";
  samples=[];
}

// ================= SEND =================
async function sendBatch(){
  if(samples.length==0) return;

  const payload={
    device_id:device_id,
    ts:new Date().toISOString(),
    samples:samples
  };

  samples=[];

  try{
    const res=await fetch(BASE+"?path=/telemetry/accel",{
      method:"POST",
      headers:{
        "Content-Type":"application/json"
      },
      body:JSON.stringify(payload)
    });

    const json=await res.json();
    console.log("POST:",json);
  }catch(err){
    console.log("send error",err);
  }
}

// ================= GET LATEST =================
async function getLatest(){
  if(!isRunning) return;

  try{
    const res=await fetch(BASE+"?path=/telemetry/accel/latest&device_id="+device_id);
    const json=await res.json();

    if(json.ok){
      latest.innerText=
`time: ${json.data.t}
x: ${json.data.x}
y: ${json.data.y}
z: ${json.data.z}`;
    }
  }catch(err){
    console.log("latest error");
  }
}

setInterval(getLatest,2000);
</script>

</body>
</html>
