<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Presensi Mahasiswa</title>
<script src="https://unpkg.com/html5-qrcode"></script>

<style>
body{
  font-family: system-ui;
  background:#f1f5f9;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}

.card{
  background:white;
  padding:20px;
  border-radius:16px;
  width:100%;
  max-width:400px;
  box-shadow:0 10px 30px rgba(0,0,0,.1);
  display:flex;
  flex-direction:column;
  gap:12px;
}

input{
  padding:12px;
  border-radius:10px;
  border:2px solid #e5e7eb;
  font-size:1rem;
}

#reader{
  width:100%;
  aspect-ratio:1/1;
  border-radius:12px;
  overflow:hidden;
}

#status{
  text-align:center;
  font-weight:bold;
  min-height:24px;
}

.success{color:#16a34a;}
.error{color:#dc2626;}
.loading{color:#64748b;}
</style>
</head>

<body>
<div class="card">
  <h3>📷 Presensi Mahasiswa</h3>

  <!-- NIM -->
  <input id="nimInput" placeholder="Masukkan NIM">

  <!-- Camera -->
  <div id="reader"></div>

  <!-- Status -->
  <div id="status" class="loading">Menunggu QR...</div>
</div>

<script>
const BASE="https://script.google.com/macros/s/AKfycbxlwUlQQXQDYzeC_eIHPTD5sU0rF44ZtHgUHOIuywz5ThXUzXIU55PM6D9cLVDVyJvA/exec";

const nimInput = document.getElementById("nimInput");
const statusEl = document.getElementById("status");

const deviceId = "web-"+Math.random().toString(36).substr(2,6);
let lastScan = "";

function setStatus(msg,type){
  statusEl.innerText = msg;
  statusEl.className = type;
}

const qr = new Html5Qrcode("reader");

qr.start(
  { facingMode:"environment" },
  { fps:10, qrbox:250 },
  async (decodedText) => {

    // cegah scan double cepat
    if(decodedText === lastScan) return;
    lastScan = decodedText;

    const nim = nimInput.value.trim();
    if(!nim){
      setStatus("❌ Isi NIM dulu", "error");
      return;
    }

    try{
      const url = new URL(decodedText);
      const token = url.searchParams.get("token");
      const course = url.searchParams.get("course");
      const session = url.searchParams.get("session");

      const payload = {
        user_id: nim,
        device_id: deviceId,
        course_id: course,
        session_id: session,
        qr_token: token,
        ts: new Date().toISOString()
      };

      setStatus("⏳ Mengirim presensi...", "loading");

      const res = await fetch(`${BASE}?path=/presence/checkin`,{
        method:"POST",
        body: JSON.stringify(payload)
      });

      const json = await res.json();

      if(json.ok){
        setStatus("✅ Presence Success", "success");
      }else if(json.error==="qr_expired"){
        setStatus("⚠️ QR Expired", "error");
      }else{
        setStatus("❌ Presence Invalid", "error");
      }

    }catch(e){
      setStatus("❌ QR tidak valid", "error");
    }

    // reset supaya bisa scan QR lain
    setTimeout(()=> lastScan="", 3000);
  },
  ()=>{}
).catch(()=>{
  setStatus("❌ Kamera tidak bisa dibuka", "error");
});
</script>
</body>
</html>
