<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scan Presensi</title>
<script src="https://unpkg.com/html5-qrcode"></script>
 
<style>
*{
box-sizing:border-box;
font-family:system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
}

body{
background:linear-gradient(135deg,#6366f1,#818cf8);
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
margin:0;
padding:15px;
}

.container{
background:#fff;
width:100%;
max-width:400px;
padding:20px;
border-radius:20px;
box-shadow:0 15px 30px rgba(0,0,0,.2);
text-align:center;
}

h2{
margin-bottom:15px;
color:#1e293b;
}

input{
width:100%;
padding:14px;
border-radius:12px;
border:1.5px solid #cbd5f5;
font-size:16px;
outline:none;
}

input:focus{
border-color:#6366f1;
}

button{
width:100%;
padding:14px;
margin-top:12px;
border:none;
border-radius:12px;
background:#6366f1;
color:#fff;
font-size:16px;
font-weight:600;
cursor:pointer;
transition:.2s;
}

button:hover{
background:#4f46e5;
}

.input-group{
margin-bottom:12px;
text-align:left;
}

.input-group label{
display:block;
font-size:13px;
font-weight:600;
margin-bottom:6px;
color:#475569;
}

#reader{
margin-top:15px;
border-radius:14px;
overflow:hidden;
display:none;
border:2px dashed #c7d2fe;
}

.badge{
margin-top:15px;
padding:12px;
border-radius:999px;
font-weight:600;
display:none;
animation:fade .3s ease-in-out;
}

.success{background:#dcfce7;color:#166534;}
.error{background:#fee2e2;color:#991b1b;}
.warning{background:#fef3c7;color:#92400e;}

@keyframes fade{
from{opacity:0;transform:translateY(-5px);}
to{opacity:1;transform:translateY(0);}
}
</style>
</head>

<body>
<div class="container">
<h2>Presensi Mahasiswa UNAIR</h2>

<div class="input-group">
<label>NIM</label>
<input id="nimInput" placeholder="Masukkan NIM">
</div>

<div class="input-group">
<label>Device ID</label>
<input id="deviceInput" placeholder="dev-001">
</div>

<button onclick="startScanner()">Scan QR</button>

<div id="reader"></div>

<div id="statusBadge" class="badge"></div>
</div>

<script>
const BASE="https://script.google.com/macros/s/AKfycbxySS5-lojND4iGPC8mXwi9EDs01mbL50ncC4hT7sfkDZWQC-k3HNuDBtIQmyM7h965/exec";

const reader=document.getElementById("reader");
const badge=document.getElementById("statusBadge");
const nimInput=document.getElementById("nimInput");

nimInput.addEventListener("input", ()=>{
badge.style.display="none";
});

let deviceId="";
let html5QrCode;
let lastScan="";

function showBadge(text,type){
badge.className="badge "+type;
badge.innerText=text;
badge.style.display="block";
}

function startScanner(){

const nim = nimInput.value.trim();
deviceId = document.getElementById("deviceInput").value.trim();

if(!nim){
showBadge("❌ Isi NIM dulu","error");
return;
}

if(!deviceId){
showBadge("❌ Isi Device ID dulu","error");
return;
}

// RESET STATUS
badge.style.display = "none";
lastScan = "";

// STOP scanner lama jika ada
if(html5QrCode){
html5QrCode.stop().catch(()=>{});
}

reader.style.display="block";

html5QrCode = new Html5Qrcode("reader");

html5QrCode.start(
{ facingMode:"environment" },
{ fps:10, qrbox:{width:250,height:250} },
onScanSuccess
).catch(()=>{
showBadge("❌ Kamera tidak bisa dibuka","error");
});
}

async function onScanSuccess(decodedText){
if(decodedText===lastScan) return;
lastScan = decodedText;

try{
const url=new URL(decodedText);
const token=url.searchParams.get("token");
const course=url.searchParams.get("course");
const session=url.searchParams.get("session");

// Ubah bagian ini di dalam async function onScanSuccess(decodedText)
const payload = {
    path: "/presence/checkin", // Tambahkan path di dalam payload JSON
    user_id: nimInput.value,
    device_id: deviceId,
    course_id: course,
    session_id: session,
    qr_token: token,
    ts: new Date().toISOString()
};

const res = await fetch(BASE, { // Hilangkan ?path= di URL-nya
    method: "POST",
    body: JSON.stringify(payload)
});

const json=await res.json();

if(json.ok){
  showBadge("✅ Presence Success","success");
}
else if(json.error==="token_expired"){
  showBadge("⚠️ QR Expired","warning");
}
else if(json.error==="already_checked_in"){
  showBadge("⚠️ Sudah presensi","warning");
}
else if(json.error==="invalid_session"){
  showBadge("❌ Session tidak cocok","error");
}
else if(json.error==="token_invalid"){
  showBadge("❌ Token tidak valid","error");
}
else{
  showBadge("❌ "+json.error,"error");
}

}catch{
showBadge("❌ QR tidak valid","error");
}

setTimeout(()=>lastScan="",3000);
}
</script>
</body>
