<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scan Presensi</title>
<script src="https://unpkg.com/html5-qrcode"></script>

<style>
body{
  font-family: system-ui;
  background: linear-gradient(135deg,#eef2ff,#f8fafc);
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
  margin:0;
}

.container{
  background:white;
  padding:20px;
  border-radius:18px;
  width:100%;
  max-width:380px;
  box-shadow:0 10px 20px rgba(0,0,0,.1);
  text-align:center;
}

input, button{
  width:100%;
  padding:12px;
  border-radius:12px;
  margin-top:10px;
  font-size:16px;
}

input{
  border:1.5px solid #e2e8f0;
}

button{
  background:#6366f1;
  color:white;
  border:none;
  font-weight:600;
  cursor:pointer;
}

#reader{
  margin-top:15px;
  border-radius:14px;
  overflow:hidden;
  display:none;
}

.badge{
  margin-top:12px;
  padding:10px;
  border-radius:20px;
  font-weight:600;
  display:none;
}

.success{background:#dcfce7;color:#166534;}
.error{background:#fee2e2;color:#991b1b;}
.warning{background:#fef3c7;color:#92400e;}
</style>
</head>

<body>
<div class="container">
  <h2>📷 Presensi Mahasiswa</h2>

  <input id="nimInput" placeholder="Masukkan NIM">

  <button onclick="startScanner()">Scan QR</button>

  <div id="reader"></div>

  <div id="statusBadge" class="badge"></div>
</div>

<script>
const BASE="https://script.google.com/macros/s/AKfycbxlwUlQQXQDYzeC_eIHPTD5sU0rF44ZtHgUHOIuywz5ThXUzXIU55PM6D9cLVDVyJvA/exec";

const reader=document.getElementById("reader");
const badge=document.getElementById("statusBadge");
const nimInput=document.getElementById("nimInput");

const deviceId="web-"+Math.random().toString(36).substr(2,6);
let html5QrCode;
let lastScan="";

function showBadge(text,type){
  badge.className="badge "+type;
  badge.innerText=text;
  badge.style.display="block";
}

function startScanner(){
  const nim = nimInput.value.trim();
  if(!nim){
    showBadge("❌ Isi NIM dulu","error");
    return;
  }

  reader.style.display="block";

  html5QrCode = new Html5Qrcode("reader");

  html5QrCode.start(
    { facingMode:"environment" },
    { fps:10, qrbox:250 },
    onScanSuccess
  ).catch(()=>{
    showBadge("❌ Kamera tidak bisa dibuka","error");
  });
}

async function onScanSuccess(decodedText){
  if(decodedText===lastScan) return;
  lastScan = decodedText;

  try{
    const url=new URL(decodedText);
    const token=url.searchParams.get("token");
    const course=url.searchParams.get("course");
    const session=url.searchParams.get("session");

    const payload={
      user_id:nimInput.value,
      device_id:deviceId,
      course_id:course,
      session_id:session,
      qr_token:token,
      ts:new Date().toISOString()
    };

    const res=await fetch(`${BASE}?path=/presence/checkin`,{
      method:"POST",
      body:JSON.stringify(payload)
    });

    const json=await res.json();

    if(json.ok){
      showBadge("✅ Presence Success","success");
    }else if(json.error==="qr_expired"){
      showBadge("⚠️ QR Expired","warning");
    }else{
      showBadge("❌ Presence Invalid","error");
    }

  }catch{
    showBadge("❌ QR tidak valid","error");
  }

  setTimeout(()=>lastScan="",3000);
}
</script>
</body>
</html>
