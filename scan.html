<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scan Presensi</title>
<script src="https://unpkg.com/html5-qrcode"></script>

<style>
*{box-sizing:border-box;}

html,body{
  width:100%;
  height:100%;
  margin:0;
}

body{
  font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
  background: linear-gradient(135deg,#eef2ff,#f8fafc);
  display:flex;
  justify-content:center;
  align-items:center;
  padding:12px;
}

.card{
  background:white;
  padding:16px;
  border-radius:18px;
  box-shadow:0 10px 30px rgba(0,0,0,0.08);
  width:100%;
  max-width:480px;
  text-align:center;
  display:flex;
  flex-direction:column;
  gap:12px;
}

h2{ 
  color:#1e293b; 
  margin:0;
}

.form-group{
  display:flex;
  flex-direction:column;
  text-align:left;
  gap:6px;
}

.form-group label{
  font-size:14px;
  font-weight:600;
  color:#334155;
}

#reader{
  width:100%;
  aspect-ratio:1/1;
  border-radius:12px;
  overflow:hidden;
}

#reader video{
  width:100% !important;
  height:100% !important;
  object-fit:cover !important;
}

input{
  width:100%;
  padding:12px;
  border-radius:10px;
  border:1px solid #e2e8f0;
}

button{
  width:100%;
  padding:12px;
  border:none;
  border-radius:12px;
  background:#6366f1;
  color:white;
  font-weight:600;
  cursor:pointer;
}

#status{
  margin-top:8px;
  font-weight:600;
}

.loading{ color:#0f172a; }
.success{ color:#16a34a; }
.error{ color:#dc2626; }

@media (max-width:480px){
  body{
    align-items:flex-start;
  }
  .card{
    margin-top:16px;
  }
}
</style>
</head>

<body>

<div class="card">

<h2>📷 Scan QR Presensi</h2>

<div id="loginBox">

<div class="form-group">
  <label>Inputkan NIM</label>
  <input id="nimInput" placeholder="Masukkan NIM">
</div>

<div class="form-group">
  <label>Inputkan Device ID</label>
  <input id="deviceInput" placeholder="Masukkan Device ID">
</div>

<button onclick="startSession()">Mulai Scan</button>

</div>

<div id="scanBox" style="display:none;">
  <div id="reader"></div>
  <div id="status" class="loading">Siapkan kamera...</div>
</div>

</div>

<script>

const BASE_URL="https://script.google.com/macros/s/AKfycbzcXUoW72V2buKQi8d4lP-5j_AdL72AF3zsPVQ1dpP1oPEdqEt9bt3COS5G08aL9SV2/exec";

// DOM
const loginBox = document.getElementById("loginBox");
const scanBox  = document.getElementById("scanBox");
const nimInput = document.getElementById("nimInput");
const deviceInput = document.getElementById("deviceInput");
const statusEl = document.getElementById("status");

// DEFAULT VALUE
const defaultNIM = "434231000";
// const defaultDevice = "dev-001" + Math.random().toString(36).substring(2,6);
const defaultDevice = "dev-001";

// LOAD FROM STORAGE
nimInput.value = localStorage.getItem("nim") || defaultNIM;
deviceInput.value = localStorage.getItem("device") || defaultDevice;

// PARAM
function param(n){
  return new URL(location.href).searchParams.get(n);
}

const token   = param("token");
const course  = param("course");
const session = param("session");

let user_id = "";
let device_id = "";

// START SESSION
function startSession(){

  const nim = nimInput.value.trim();
  const device = deviceInput.value.trim();

  if(!nim || !device){
    alert("NIM dan Device ID wajib diisi");
    return;
  }

  user_id = nim;
  device_id = device;

  // simpan agar next buka otomatis
  localStorage.setItem("nim", nim);
  localStorage.setItem("device", device);

  loginBox.style.display="none";
  scanBox.style.display="block";

  startScanner();
}

// CHECKIN
async function checkin(qrToken){

  setStatus("⏳ Mengirim presensi...", "loading");

  try{

    const res = await fetch(BASE+"?path=/presence/checkin",{
      method:"POST",
      body:JSON.stringify({
        user_id:user_id,
        device_id:device_id,
        course_id:course,
        session_id:session,
        qr_token:qrToken,
        ts:new Date().toISOString()
      })
    });

    const json = await res.json();

    if(json.ok){

      setStatus("✅ PRESENSI BERHASIL", "success");

      new Audio("https://actions.google.com/sounds/v1/cartoon/clang_and_wobble.ogg").play();

    }else{

      setStatus("❌ "+json.error, "error");

    }

  }catch(err){

    setStatus("❌ Gagal koneksi server", "error");

  }
}

// SCANNER
function startScanner(){

  const scanner = new Html5Qrcode("reader");

  const size = Math.min(window.innerWidth * 0.9, 360);

  scanner.start(
    { facingMode:"environment" },
    { fps:10, qrbox: size * 0.75 },

    text=>{

      setStatus("QR terdeteksi, memproses...", "loading");

      const params = new URL(text).searchParams;
      const qrToken = params.get("token");

      checkin(qrToken);

    }

  );
}

// STATUS
function setStatus(text,type){
  statusEl.innerText=text;
  statusEl.className=type;
}

</script>

</body>
</html>
