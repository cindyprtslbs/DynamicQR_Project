<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>GPS Tracker</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<style>

*{box-sizing:border-box;}

html,body{
width:100%;
height:100%;
margin:0;
}

body{
font-family:system-ui;
background:linear-gradient(135deg,#eef2ff,#f8fafc);
display:flex;
justify-content:center;
align-items:center;
padding:16px;
}

.card{
background:white;
padding:24px;
border-radius:18px;
box-shadow:0 10px 30px rgba(0,0,0,0.08);
width:100%;
max-width:520px;
display:flex;
flex-direction:column;
gap:12px;
text-align:center;
}

h2{
margin:0;
}

button{
width:100%;
padding:14px;
border:none;
border-radius:12px;
background:#6366f1;
color:white;
font-weight:600;
font-size:16px;
cursor:pointer;
}

#map{
width:100%;
height:320px;
border-radius:12px;
}

#status{
font-size:14px;
font-weight:600;
}

</style>
</head>

<body>

<div class="card">

<h2>📍 GPS Tracking</h2>

<button onclick="start()">Start Tracking</button>

<div id="status">Menunggu GPS...</div>

<div id="map"></div>

</div>

<script>

const BASE_URL="https://script.google.com/macros/s/AKfycbyYPdTcsY2MpQIijcj2oplM1VtolC3JbTDfgSqoV2BDsafa5KBDJL9ggNdRp37-6ysG/exec";


// DEVICE ID
let device_id=localStorage.getItem("device_id");

if(!device_id){

device_id="device-"+Math.random().toString(36).substr(2,5);

localStorage.setItem("device_id",device_id);

}


// MAP
let map=L.map("map").setView([-7.25,112.75],13);

L.tileLayer(
"https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
{maxZoom:19}
).addTo(map);


// STORAGE
let markers={};
let polylines={};
let historyCache={};

const colors=["red","blue","green","orange","purple","black"];


const statusEl=document.getElementById("status");


// START GPS
function start(){

if(!navigator.geolocation){

alert("GPS tidak tersedia");

return;

}

statusEl.innerText="Device: "+device_id;

navigator.geolocation.watchPosition(pos=>{

const lat=pos.coords.latitude;
const lng=pos.coords.longitude;
const acc=pos.coords.accuracy;

statusEl.innerText=
"Device: "+device_id+
" | "+lat.toFixed(5)+","+lng.toFixed(5);

sendGPS(lat,lng,acc);

},err=>{

statusEl.innerText="GPS error";

},{
enableHighAccuracy:true
});

setInterval(loadHistory,3000);

}


// SEND GPS
async function sendGPS(lat,lng,acc){

try{

await fetch(BASE_URL+"?path=/telemetry/gps",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({
device_id:device_id,
ts:new Date().toISOString(),
lat:lat,
lng:lng,
accuracy_m:acc
})

});

}catch(e){

console.log("send error",e);

}

}


// UPDATE DEVICE
function updateDevice(id,points){

if(!markers[id]){

const color=colors[
Object.keys(markers).length % colors.length
];

const icon=L.divIcon({

className:"",

html:`<div style="
width:16px;
height:16px;
background:${color};
border:2px solid white;
border-radius:50%;
"></div>`

});

markers[id]=L.marker(points[points.length-1],{icon})
.addTo(map)
.bindPopup("Device: "+id);

polylines[id]=L.polyline(points,{
color:color,
weight:4
}).addTo(map);

}else{

markers[id].setLatLng(points[points.length-1]);

polylines[id].setLatLngs(points);

}

}


// LOAD HISTORY
async function loadHistory(){

try{

const res=await fetch(BASE_URL+"?path=/telemetry/gps/history&limit=200");

const json=await res.json();

if(!json.ok) return;

const data=json.data.items;


// kelompokkan per device
let grouped={};

data.forEach(p=>{

if(!grouped[p.device_id]){

grouped[p.device_id]=[];

}

grouped[p.device_id].push([p.lat,p.lng]);

});


// render tiap device
Object.keys(grouped).forEach(id=>{

updateDevice(id,grouped[id]);

});

}catch(e){

console.log("history error",e);

}

}

</script>

</body>
</html>
