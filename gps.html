<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>GPS Tracker</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
 
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<style>

*{box-sizing:border-box;}

html,body{
  width:100%;
  height:100%;
  margin:0;
}

body{
  font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
  background: linear-gradient(135deg,#eef2ff,#f8fafc);
}

/* FULLSCREEN CONTAINER */
.card{
  width:100%;
  height:100%;
  max-width:none;
  border-radius:0;
  padding:12px;
  display:flex;
  flex-direction:column;
  gap:12px;
}

/* MAP FLEX FULL */
#map{
  flex:1;
  width:100%;
  border-radius:12px;
  overflow:hidden;
}

h2{
  margin:0;
  color:#1e293b;
}

button{
  width:100%;
  padding:14px;
  border:none;
  border-radius:12px;
  background:#6366f1;
  color:white;
  font-weight:600;
  font-size:16px;
  cursor:pointer;
}

button:hover{
  background:#4f46e5;
}

#status{
  font-size:14px;
  font-weight:600;
  color:#334155;
}

</style>
</head>

<body>

<div class="card">

<h2>GPS Tracking</h2>

<div style="margin-bottom:12px;">
  <label style="display:block; font-size:13px; font-weight:600; color:#334155; margin-bottom:6px;">Target Base URL (Swap Test)</label>
  <input id="baseUrlInput" placeholder="https://script.google.com/..." style="width:100%; padding:11px 12px; border-radius:10px; border:1px solid #e2e8f0; font-size:14px; outline:none;">
</div>

<button onclick="start()">Start Tracking</button>
<button onclick="swapUrl()" style="margin-top:8px; background:#10b981;">Swap URL</button>

<div id="status">Menunggu GPS...</div>

<div id="map"></div>

</div>

<script>

const PRODUCTION_URL="https://script.google.com/macros/s/AKfycbzv51G_mCrDQfYPiH6xsz2AGXJwLvhryBJJhnhe7e69Quf8Dgjkj6n_e73HBKUJyBos/exec";
const TEST_URL="https://script.google.com/macros/s/AKfycbxySS5-lojND4iGPC8mXwi9EDs01mbL50ncC4hT7sfkDZWQC-k3HNuDBtIQmyM7h965/exec";

const DEFAULT_BASE_URL=TEST_URL;

// ================= DEVICE ID AUTO =================

let device_id = localStorage.getItem("device_id");

if(!device_id){
  device_id="device-"+Math.random().toString(36).substring(2,6);
  localStorage.setItem("device_id",device_id);
}

document.getElementById("baseUrlInput").value=DEFAULT_BASE_URL;

let baseUrl=DEFAULT_BASE_URL;

// ================= MAP INIT =================

let map=L.map("map").setView([-7.25,112.75],13);

L.tileLayer(
  "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png"
).addTo(map);

// ================= DEVICE STORAGE =================

let markers={};
let polylines={};

const colors=["red","blue","green","orange","purple","black"];

// ================= STATUS =================

const statusEl=document.getElementById("status");

// ================= START GPS =================

function start(){

  const baseUrlInput = document.getElementById("baseUrlInput").value.trim();
  baseUrl = baseUrlInput || DEFAULT_BASE_URL;

  if(!navigator.geolocation){
    alert("GPS tidak tersedia");
    return;
  }

  statusEl.innerText="Device: "+device_id;

  navigator.geolocation.watchPosition(pos=>{

    const lat=pos.coords.latitude;
    const lng=pos.coords.longitude;
    const acc=pos.coords.accuracy;

    statusEl.innerText=
      "Device: "+device_id+
      " | Lat:"+lat.toFixed(5)+
      " Lng:"+lng.toFixed(5);

    sendGPS(lat,lng,acc);

  },err=>{

    statusEl.innerText="❌ GPS error";

  },{
    enableHighAccuracy:true,
    maximumAge:0,
    timeout:5000
  });

  setInterval(loadHistory,5000);

}

// ================= SEND GPS =================

async function sendGPS(lat,lng,acc){

  await fetch(baseUrl+"?path=/telemetry/gps",{
    method:"POST",
    body:JSON.stringify({
      device_id:device_id,
      ts:new Date().toISOString(),
      lat:lat,
      lng:lng,
      accuracy_m:acc
    })
  });

}

function animateMarker(marker, from, to, duration=800){

  const start = performance.now();

  function frame(now){

    const progress = Math.min((now-start)/duration,1);

    const lat = from[0] + (to[0]-from[0]) * progress;
    const lng = from[1] + (to[1]-from[1]) * progress;

    marker.setLatLng([lat,lng]);

    if(progress < 1){
      requestAnimationFrame(frame);
    }
  }

  requestAnimationFrame(frame);

}

// ================= UPDATE DEVICE =================

function updateDevice(id,lat,lng){

  if(!markers[id]){

    const color=colors[
      Object.keys(markers).length % colors.length
    ];

    const icon=L.divIcon({
      className:"custom-marker",
      html:`<div style="
        background:${color};
        width:16px;
        height:16px;
        border-radius:50%;
        border:2px solid white;
      "></div>`
    });

    markers[id]=L.marker([lat,lng],{icon})
      .addTo(map)
      .bindPopup("Device: "+id);

    polylines[id]=L.polyline([],{
      color:color
    }).addTo(map);

  }else{

    const old = markers[id].getLatLng();

    animateMarker(
      markers[id],
      [old.lat,old.lng],
      [lat,lng],
      800
    );

    map.panTo([lat,lng]);

  }

  polylines[id].addLatLng([lat,lng]);

}

let lastMarker = null;

// ================= LAST LOCATION =================

if(id === device_id){

  if(!lastMarker){

    lastMarker = L.marker([lat,lng],{
      icon: L.divIcon({
        className:"last-marker",
        html:`<div style="
          background:#22c55e;
          width:18px;
          height:18px;
          border-radius:50%;
          border:3px solid white;
        "></div>`
      })
    }).addTo(map)
      .bindPopup("Lokasi Terakhir");

  }else{
    lastMarker.setLatLng([lat,lng]);
  }

}

// ================= LOAD HISTORY =================

async function loadHistory(){

  const res=await fetch(baseUrl+"?path=/telemetry/gps/history&limit=200");

  const json=await res.json();

  if(!json.ok) return;

  const data=json.data.items;

  data.forEach(p=>{

    updateDevice(p.device_id,p.lat,p.lng);

  });

}

// ================= SWAP URL =================

function swapUrl(){
  const current = document.getElementById("baseUrlInput").value;
  const newUrl = current === PRODUCTION_URL ? TEST_URL : PRODUCTION_URL;
  document.getElementById("baseUrlInput").value = newUrl;
  baseUrl = newUrl;
}

</script>

</body>
</html>
