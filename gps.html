<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>GPS Tracker</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<style>

*{box-sizing:border-box;}

html,body{
  width:100%;
  height:100%;
  margin:0;
}

body{
  font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  background:linear-gradient(135deg,#eef2ff,#f8fafc);
  display:flex;
  justify-content:center;
  align-items:center;
  padding:16px;
}

.card{
  background:white;
  padding:24px 20px;
  border-radius:18px;
  box-shadow:0 10px 30px rgba(0,0,0,0.08);
  width:100%;
  max-width:520px;
  display:flex;
  flex-direction:column;
  gap:12px;
  text-align:center;
}

h2{
  margin:0;
  color:#1e293b;
}

button{
  width:100%;
  padding:14px;
  border:none;
  border-radius:12px;
  background:#6366f1;
  color:white;
  font-weight:600;
  font-size:16px;
  cursor:pointer;
}

button:hover{
  background:#4f46e5;
}

#status{
  font-size:14px;
  font-weight:600;
  color:#334155;
}

#map{
  width:100%;
  height:320px;
  border-radius:12px;
  overflow:hidden;
}

</style>
</head>

<body>

<div class="card">

<h2>GPS Tracking</h2>

<button onclick="start()">Start Tracking</button>

<div id="status">Menunggu GPS...</div>

<div id="map"></div>

</div>

<script>

const BASE_URL="https://script.google.com/macros/s/AKfycbx2muAd_frIox42s18VScvt8xaZj11rwB85KloGpK1zMF3uk9UaNowk6mYCqcnibISM/exec";


// ================= DEVICE ID =================

let device_id=localStorage.getItem("device_id");

if(!device_id){

  device_id="device-"+Math.random().toString(36).substring(2,7);

  localStorage.setItem("device_id",device_id);

}


// ================= MAP =================

let map=L.map("map").setView([-7.25,112.75],13);

L.tileLayer(
"https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
{
maxZoom:19
}
).addTo(map);


// ================= STORAGE =================

let markers={};
let polylines={};
let historyCache={};

const colors=["red","blue","green","orange","purple","black"];

const statusEl=document.getElementById("status");


// ================= START GPS =================

function start(){

if(!navigator.geolocation){

alert("GPS tidak tersedia");

return;

}

statusEl.innerText="Device: "+device_id+" | mencari GPS...";

navigator.geolocation.watchPosition(

pos=>{

const lat=pos.coords.latitude;
const lng=pos.coords.longitude;
const acc=pos.coords.accuracy;

statusEl.innerText=
"Device: "+device_id+
" | Lat:"+lat.toFixed(5)+
" Lng:"+lng.toFixed(5);

sendGPS(lat,lng,acc);

},

err=>{

statusEl.innerText="❌ GPS error";

},

{
enableHighAccuracy:true,
maximumAge:0,
timeout:5000
}

);

setInterval(loadHistory,5000);

}


// ================= SEND GPS =================

async function sendGPS(lat,lng,acc){

try{

await fetch(BASE_URL+"?path=/telemetry/gps",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

device_id:device_id,
ts:new Date().toISOString(),
lat:lat,
lng:lng,
accuracy_m:acc

})

});

}catch(e){

console.log("send error",e);

}

}


// ================= UPDATE DEVICE =================

function updateDevice(id,lat,lng){

if(!markers[id]){

const color=colors[
Object.keys(markers).length % colors.length
];

const icon=L.divIcon({

className:"custom-marker",

html:`<div style="
background:${color};
width:16px;
height:16px;
border-radius:50%;
border:2px solid white;
"></div>`

});

markers[id]=L.marker([lat,lng],{icon})
.addTo(map)
.bindPopup("Device: "+id);

polylines[id]=L.polyline([],{
color:color,
weight:4
}).addTo(map);

historyCache[id]=[];

}

markers[id].setLatLng([lat,lng]);

historyCache[id].push([lat,lng]);

polylines[id].setLatLngs(historyCache[id]);

map.setView([lat,lng],16);

}


// ================= LOAD HISTORY =================

async function loadHistory(){

try{

const res=await fetch(
BASE_URL+"?path=/telemetry/gps/history&limit=200"
);

const json=await res.json();

if(!json.ok) return;

const data=json.data.items;

let grouped={};

data.forEach(p=>{

if(!grouped[p.device_id]){

grouped[p.device_id]=[];

}

grouped[p.device_id].push([p.lat,p.lng]);

});

Object.keys(grouped).forEach(id=>{

if(!markers[id]){

updateDevice(id,grouped[id][0][0],grouped[id][0][1]);

}

historyCache[id]=grouped[id];

polylines[id].setLatLngs(grouped[id]);

markers[id].setLatLng(grouped[id][grouped[id].length-1]);

});

}catch(e){

console.log("history error",e);

}

}

</script>

</body>
</html>
