<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Accelerometer Monitor</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

body{
font-family:system-ui;
background:#f1f5f9;
margin:0;
padding:20px;
}

h1{
text-align:center;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
gap:20px;
}

.card{
background:white;
padding:20px;
border-radius:14px;
box-shadow:0 8px 20px rgba(0,0,0,0.08);
}

.status{
font-weight:bold;
margin-bottom:10px;
}

.active{color:green}
.offline{color:gray}

canvas{
height:150px;
}

</style>
</head>

<body>

<h1>Accelerometer Monitor</h1>

<div class="grid" id="devices"></div>

<script>

const BASE_URL="https://script.google.com/macros/s/AKfycbzcXUoW72V2buKQi8d4lP-5j_AdL72AF3zsPVQ1dpP1oPEdqEt9bt3COS5G08aL9SV2/exec";

const devices={};

function createCard(device){

const container=document.getElementById("devices");

const div=document.createElement("div");
div.className="card";
div.id="card-"+device;

div.innerHTML=`

<h3>${device}</h3>

<div class="status" id="status-${device}">Waiting...</div>

<canvas id="chart-${device}"></canvas>

`;

container.appendChild(div);

const ctx=document.getElementById("chart-"+device).getContext("2d");

devices[device]={

chart:new Chart(ctx,{
type:"line",
data:{
labels:[],
datasets:[
{label:"X",borderColor:"red",data:[]},
{label:"Y",borderColor:"green",data:[]},
{label:"Z",borderColor:"blue",data:[]}
]
},
options:{
animation:false,
scales:{y:{min:-20,max:20}}
}
}),

lastUpdate:0

};

}

function updateChart(device,x,y,z){

const dev=devices[device];

const t=new Date().toLocaleTimeString();

dev.chart.data.labels.push(t);

dev.chart.data.datasets[0].data.push(x);
dev.chart.data.datasets[1].data.push(y);
dev.chart.data.datasets[2].data.push(z);

if(dev.chart.data.labels.length>20){

dev.chart.data.labels.shift();
dev.chart.data.datasets.forEach(d=>d.data.shift());

}

dev.chart.update();

dev.lastUpdate=Date.now();

}

async function fetchData(){

const res=await fetch(BASE_URL+"?path=/telemetry/accel/history&limit=50");
const json=await res.json();

if(!json.ok) return;

json.data.items.forEach(item=>{

const device=item.device_id;

if(!devices[device]) createCard(device);

updateChart(device,item.x,item.y,item.z);

});

updateStatus();

}

function updateStatus(){

Object.keys(devices).forEach(device=>{

const last=devices[device].lastUpdate;

const diff=(Date.now()-last)/1000;

const el=document.getElementById("status-"+device);

if(diff<10){

el.innerHTML="● ACTIVE";
el.className="status active";

}else{

el.innerHTML="● OFFLINE";
el.className="status offline";

}

});

}

setInterval(fetchData,2000);

</script>

</body>
</html>
