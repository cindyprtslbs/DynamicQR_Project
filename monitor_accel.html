<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Accelerometer Monitor</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

body{
font-family:system-ui,-apple-system;
background:linear-gradient(135deg,#eef2ff,#f8fafc);
margin:0;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.card{

width:850px;
background:white;
padding:30px;
border-radius:16px;
box-shadow:0 10px 30px rgba(0,0,0,0.08);

}

.header{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:20px;
}

.title{
font-size:22px;
font-weight:700;
color:#1e293b;
}

.controls{
display:flex;
gap:10px;
}

input{
padding:10px 12px;
border-radius:10px;
border:1px solid #e2e8f0;
font-size:14px;
}

button{
padding:10px 16px;
border:none;
border-radius:10px;
background:#6366f1;
color:white;
font-weight:600;
cursor:pointer;
}

.status{
font-size:14px;
font-weight:600;
margin-top:10px;
}

.active{color:#16a34a}
.offline{color:#64748b}

.sensor-grid{
display:grid;
grid-template-columns:1fr 1fr 1fr;
gap:12px;
margin-top:16px;
}

.sensor{
background:#f8fafc;
padding:14px;
border-radius:12px;
text-align:center;
box-shadow:inset 0 0 0 1px #e2e8f0;
}

.sensor-title{
font-size:12px;
color:#64748b;
margin-bottom:4px;
}

.sensor-value{
font-size:20px;
font-weight:700;
}

canvas{
margin-top:25px;
}

</style>
</head>

<body>

<div class="card">

<div class="header">

<div class="title">Accelerometer Monitor</div>

<div class="controls">
<input id="deviceInput" value="dev-001">
<button onclick="startMonitor()">Monitor</button>
</div>

</div>

<div id="status" class="status">Waiting device...</div>

<div class="sensor-grid">

<div class="sensor">
<div class="sensor-title">X Axis</div>
<div id="xVal" class="sensor-value">0</div>
</div>

<div class="sensor">
<div class="sensor-title">Y Axis</div>
<div id="yVal" class="sensor-value">0</div>
</div>

<div class="sensor">
<div class="sensor-title">Z Axis</div>
<div id="zVal" class="sensor-value">0</div>
</div>

</div>

<canvas id="chart" height="120"></canvas>

</div>

<script>

const BASE_URL="https://script.google.com/macros/s/AKfycbzcXUoW72V2buKQi8d4lP-5j_AdL72AF3zsPVQ1dpP1oPEdqEt9bt3COS5G08aL9SV2/exec";

let device="";
let lastUpdate=0;

const chart=new Chart(document.getElementById("chart"),{

type:"line",

data:{
labels:[],
datasets:[
{label:"X",borderColor:"#ef4444",data:[],pointRadius:0},
{label:"Y",borderColor:"#22c55e",data:[],pointRadius:0},
{label:"Z",borderColor:"#3b82f6",data:[],pointRadius:0}
]
},

options:{
animation:false,
responsive:true,
scales:{y:{min:-20,max:20}}
}

});

function startMonitor(){

device=document.getElementById("deviceInput").value.trim();

chart.data.labels=[];
chart.data.datasets.forEach(d=>d.data=[]);

chart.update("none");

}

function updateChart(x,y,z){

document.getElementById("xVal").innerText=x.toFixed(2);
document.getElementById("yVal").innerText=y.toFixed(2);
document.getElementById("zVal").innerText=z.toFixed(2);

chart.data.labels.push(Date.now());

chart.data.datasets[0].data.push(x);
chart.data.datasets[1].data.push(y);
chart.data.datasets[2].data.push(z);

if(chart.data.labels.length>25){
chart.data.labels.shift();
chart.data.datasets.forEach(d=>d.data.shift());
}

chart.update("none");

lastUpdate=Date.now();

updateStatus();

}

function updateStatus(){

const diff=(Date.now()-lastUpdate)/1000;

const el=document.getElementById("status");

if(diff<5){

el.innerHTML="● Device ACTIVE";
el.className="status active";

}else{

el.innerHTML="● Device OFFLINE";
el.className="status offline";

}

}

async function fetchData(){

if(!device) return;

try{

const res=await fetch(BASE_URL+"?path=/telemetry/accel/latest&device_id="+device,{
cache:"no-store"
});

const json=await res.json();

if(!json.ok || !json.data) return;

const dataTime = new Date(json.data.t).getTime();
const now = Date.now();

const delay = (now - dataTime) / 1000;

// kalau data lebih dari 5 detik = device stop
if(delay > 5){
updateStatus();
return;
}

const x = Number(json.data.x);
const y = Number(json.data.y);
const z = Number(json.data.z);

updateChart(x,y,z);

}catch(e){}

}

setInterval(fetchData,150);
setInterval(updateStatus,1000);

</script>

</body>
</html>
